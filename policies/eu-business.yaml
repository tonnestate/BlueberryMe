extends: base.yaml
version: BBM/1-draft-0.2

quality:
  # Explicit, non-guessing formats. Organizations can add formats to their own profile.
  accepted_birth_date_formats:
    - "%Y-%m-%d"
    - "%d.%m.%Y"
    - "%Y%m%d"

classes:
  PERSON:
    action: TOKENIZE
    token_mode: LEASE_HANDLE
    rehydrate:
      LETTER_SERVICE: ["DELIVER"]
      SOURCE_SYSTEM: ["LOOKUP"]

  EMAIL:
    action: TOKENIZE
    token_mode: LEASE_HANDLE
    rehydrate:
      MAIL_DELIVERY: ["DELIVER"]
    quality:
      on_invalid: SUPPRESS

  PHONE:
    action: TOKENIZE
    token_mode: LEASE_HANDLE
    rehydrate:
      TELEPHONY: ["CALL"]
    quality:
      on_invalid: SUPPRESS

  ADDRESS:
    action: TOKENIZE
    token_mode: LEASE_HANDLE
    rehydrate:
      LETTER_SERVICE: ["DELIVER"]
      SOURCE_SYSTEM: ["LOOKUP"]

  CASE_ID:
    action: TOKENIZE
    token_mode: LEASE_HANDLE
    rehydrate:
      SOURCE_SYSTEM: ["LOOKUP", "UPDATE_CASE"]

  BIRTH_DATE:
    action: GENERALIZE
    rehydrate: {}
    quality:
      on_invalid: SUPPRESS

  IBAN:
    action: DENY
    rehydrate: {}
    quality:
      on_invalid: SUPPRESS

  SECRET:
    action: DENY
    rehydrate: {}

  HEALTH_DATA:
    action: ALLOW
    allowed_purposes: ["CLAIM_REVIEW"]
    rehydrate: {}

  PUBLIC:
    action: ALLOW
    rehydrate: {}
