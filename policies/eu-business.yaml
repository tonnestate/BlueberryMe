extends: base.yaml
version: BBM/1-draft-0.4

quality:
  accepted_birth_date_formats:
    - "%Y-%m-%d"
    - "%d.%m.%Y"
    - "%Y%m%d"

classes:
  UNKNOWN:
    action: TOKENIZE
    rehydrate: {}

  PERSON:
    action: TOKENIZE
    rehydrate:
      LETTER_SERVICE: ["DELIVER"]
      SOURCE_SYSTEM: ["LOOKUP"]

  EMAIL:
    action: TOKENIZE
    rehydrate:
      MAIL_DELIVERY: ["DELIVER"]

  PHONE:
    action: TOKENIZE
    rehydrate:
      TELEPHONY: ["CALL"]

  ADDRESS:
    action: TOKENIZE
    rehydrate:
      LETTER_SERVICE: ["DELIVER"]
      SOURCE_SYSTEM: ["LOOKUP"]

  CASE_ID:
    action: TOKENIZE
    rehydrate:
      SOURCE_SYSTEM: ["LOOKUP", "UPDATE_CASE"]

  BIRTH_DATE:
    # Source remains byte/value-exact. No lossy generalisation in the core path.
    action: TOKENIZE
    rehydrate:
      SOURCE_SYSTEM: ["LOOKUP"]

  IBAN:
    action: TOKENIZE
    rehydrate:
      PAYMENT_SERVICE: ["PAY"]

  SECRET:
    action: DENY
    rehydrate: {}

  HEALTH_DATA:
    action: ALLOW
    allowed_purposes: ["CLAIM_REVIEW"]
    rehydrate: {}

  PUBLIC:
    action: ALLOW
    rehydrate: {}

flows:
  - origin_scope: "*"
    purposes: ["CLAIM_REVIEW"]
    sinks:
      SOURCE_SYSTEM: ["LOOKUP", "UPDATE_CASE"]
      LETTER_SERVICE: ["DELIVER"]
      MAIL_DELIVERY: ["DELIVER"]
      TELEPHONY: ["CALL"]
      PAYMENT_SERVICE: ["PAY"]
      GITHUB: ["WRITE_REPO"]


# Dataset-context policy is evaluated at the agent egress boundary. It can be
# stricter or more purpose-specific than the generic data-class policy.
datasets:
  - id: HR_EMPLOYEE
    match: "HR.*"
    risk: HIGH
    default_action: DENY
    purposes:
      SQL_DEBUGGING:
        operations: ["READ_GRID", "GetGridResults"]
        destinations: ["LUNA", "AGENT:*"]
        agents: ["*"]
        lease_scopes: ["SQL:*", "HR:*"]
        max_rows: 100
        default_action: HANDLE
        fields:
          "*salary*": AGGREGATE
          "*Salary*": AGGREGATE
          "*iban*": DENY
          "*IBAN*": DENY
          "*bank*": DENY
          "*Bank*": DENY
          "*health*": DENY
          "*Health*": DENY
        classes:
          PERSON: HANDLE
          EMAIL: HANDLE
          PHONE: HANDLE
          ADDRESS: HANDLE
          BIRTH_DATE: HANDLE
          IBAN: DENY
          HEALTH_DATA: DENY
          SECRET: DENY
          PUBLIC: HANDLE
          UNKNOWN: HANDLE

      PAYROLL_SUPPORT:
        operations: ["READ_GRID", "GetGridResults"]
        destinations: ["LUNA", "AGENT:*"]
        agents: ["*"]
        lease_scopes: ["EMPLOYEE:*"]
        max_rows: 1
        default_action: DENY
        fields:
          "*salary*": REVEAL
          "*Salary*": REVEAL
        classes:
          PERSON: REVEAL
          IBAN: REVEAL
          PUBLIC: REVEAL
          HEALTH_DATA: DENY
          SECRET: DENY
