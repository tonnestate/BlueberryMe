extends: base.yaml
version: BBM/1-draft-0.3

quality:
  accepted_birth_date_formats:
    - "%Y-%m-%d"
    - "%d.%m.%Y"
    - "%Y%m%d"

classes:
  UNKNOWN:
    action: TOKENIZE
    rehydrate: {}

  PERSON:
    action: TOKENIZE
    rehydrate:
      LETTER_SERVICE: ["DELIVER"]
      SOURCE_SYSTEM: ["LOOKUP"]

  EMAIL:
    action: TOKENIZE
    rehydrate:
      MAIL_DELIVERY: ["DELIVER"]

  PHONE:
    action: TOKENIZE
    rehydrate:
      TELEPHONY: ["CALL"]

  ADDRESS:
    action: TOKENIZE
    rehydrate:
      LETTER_SERVICE: ["DELIVER"]
      SOURCE_SYSTEM: ["LOOKUP"]

  CASE_ID:
    action: TOKENIZE
    rehydrate:
      SOURCE_SYSTEM: ["LOOKUP", "UPDATE_CASE"]

  BIRTH_DATE:
    # Source remains byte/value-exact. No lossy generalisation in the core path.
    action: TOKENIZE
    rehydrate:
      SOURCE_SYSTEM: ["LOOKUP"]

  IBAN:
    action: TOKENIZE
    rehydrate:
      PAYMENT_SERVICE: ["PAY"]

  SECRET:
    action: DENY
    rehydrate: {}

  HEALTH_DATA:
    action: ALLOW
    allowed_purposes: ["CLAIM_REVIEW"]
    rehydrate: {}

  PUBLIC:
    action: ALLOW
    rehydrate: {}

flows:
  - origin_scope: "*"
    purposes: ["CLAIM_REVIEW"]
    sinks:
      SOURCE_SYSTEM: ["LOOKUP", "UPDATE_CASE"]
      LETTER_SERVICE: ["DELIVER"]
      MAIL_DELIVERY: ["DELIVER"]
      TELEPHONY: ["CALL"]
      PAYMENT_SERVICE: ["PAY"]
      GITHUB: ["WRITE_REPO"]
