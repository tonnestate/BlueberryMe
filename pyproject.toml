[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueberryme"
version = "0.4.5"
description = "Open Agent Privacy Protocol & Sensitive Data Bypass Runtime for privacy-preserving AI agent access."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "BlueberryMe contributors" }]
dependencies = [
  "cryptography>=42",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "mcp>=1.0",
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
blueberryme = "blueberryme.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
